{% set name = "clusterpilot" %}
{% set version = "0.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: da209518f78bae5a7096ef1c020fdbc36e2a0e7caa7ff9b054feb65b2a1a3c8c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - clusterpilot = clusterpilot.__main__:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - textual >=0.85
    - anthropic >=0.52
    - openai >=1.0
    - httpx >=0.27
    - aiosqlite >=0.20
    - tomli >=2.0

test:
  imports:
    - clusterpilot
  commands:
    - clusterpilot --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/ju-pixel/clusterpilot
  summary: AI-assisted HPC workflow manager for SLURM clusters
  description: |
    ClusterPilot automates the full local-to-cluster research cycle: generate
    SLURM scripts with AI, upload files, submit jobs, monitor with a background
    daemon, receive push notifications, and sync results back automatically.
    Supports Compute Canada / DRAC (Cedar, Narval, Graham, Beluga), University
    of Manitoba Grex, and any generic SLURM cluster.
  license: MIT
  license_file: LICENSE
  doc_url: https://github.com/ju-pixel/clusterpilot#readme
  dev_url: https://github.com/ju-pixel/clusterpilot

extra:
  recipe-maintainers:
    - ju-pixel
